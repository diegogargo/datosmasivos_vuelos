[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "datosmasivos-vuelos"
version = "0.1.0"
requires-python = ">=3.12"
description = "Base del equipo para ingeniería de retrasos de vuelos"
dependencies = ["pandas==3.0.6","numpy==2.5.4","pyarrow==26.0.0","matplotlib==3.11.2","PyYAML==6.0.3"]
[tool.setuptools.packages.find]
include = ["src*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
