name: Comprobaciones del repositorio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m src.validation.audit_sample
      - run: python -m src.processing.build_dataset
      - run: python -m src.validation.validate_dataset
      - run: python scripts/check_repository.py
