name: Transformaciones Spark
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-spark.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-spark.txt
      - run: python -m pytest tests/test_silver.py tests/test_historical_features.py tests/test_layer_validation.py -q
